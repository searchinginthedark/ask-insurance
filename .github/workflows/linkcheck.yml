name: Link check

# Weekly re-check of every link the app shows, and of every figure in data/guide.json against its source. A dead, soft-404 or wrong-page link turns the run
# red (GitHub emails the repo owner). Bot-walled sites report "blocked", which does not fail the run.
on:
  schedule:
    - cron: "17 1 * * 1"   # Mondays 09:17 SGT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 PyMuPDF
      - run: python tools/check_links.py
      # Every figure in guide.json must still be on its source page. A red run here means a
      # government figure changed (CareShield payouts rise each year) and the guide needs updating.
      - if: always()
        run: python tools/verify_guide.py
      # The Compare tab's Shield plan table is copied from MOH's comparison PDFs. A red run here
      # means MOH published new figures: run tools/moh_ip.py locally and commit the new file.
      # PyMuPDF is pinned because its table detection changes between versions.
      - if: always()
        run: pip install PyMuPDF==1.26.5 && python tools/moh_ip.py --check
