name: Link check

# Weekly re-check of every link the app shows. A dead, soft-404 or wrong-page link turns the run
# red (GitHub emails the repo owner). Bot-walled sites report "blocked", which does not fail the run.
on:
  schedule:
    - cron: "17 1 * * 1"   # Mondays 09:17 SGT
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python tools/check_links.py
